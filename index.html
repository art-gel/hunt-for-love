<head>
    <meta charset="UTF-8">
    <title>Hunt for Love</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
      <div id="soundBadge"><span class="material-symbols-outlined">volume_up</span> This game has sound</div>
    <div id="heartsPill">
        <span id="heartsDisplay"></span>
        <p class="hearts-goal">Collect 15 hearts to win!</p>
    </div>
    
    <div class="app-layout"></div>

    <div id="game">
        <h1>Hunt for Love <img src="icons/heart-suit.svg" class="title-icon"></h1>

        <p id="introText">
            I have a question for you...
            <br>
            But first, you have to complete a few challenges!
        </p>

       <p class="art-credit"><span class="material-symbols-outlined">palette</span> All the artwork in this game was hand-drawn by me</p>

        <button id="startButton">
            Start Adventure
        </button>
    </div>

    <script src="games/stop-the-clock.js"></script>
    <script src="games/matrix.js"></script>
    <script src="games/password.js"></script>
    <script src="games/find-heart.js"></script>
    <script src="games/color-dodge.js"></script>
    <script src="games/chain-reaction.js"></script>
    <script src="games/word-search.js"></script>
    <script src="games/perfect-match.js"></script>
    <script src="games/jinxed.js"></script>
    <script src="proposal.js"></script>
    <script src="script.js"></script>

</body>
